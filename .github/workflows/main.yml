name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORGE_VERSION: "1.20.1-47.3.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Descargar Forge MDK
        run: |
          curl -fL -o mdk.zip "https://maven.minecraftforge.net/net/minecraftforge/forge/${FORGE_VERSION}/forge-${FORGE_VERSION}-mdk.zip"
          mkdir mdk
          unzip -q mdk.zip -d mdk

      - name: Colocar archivos en su sitio
        run: |
          B=mdk/src/main
          rm -rf mdk/src
          mkdir -p $B/java/com/immersiveaudio/client
          mkdir -p $B/resources/META-INF
          mkdir -p $B/resources/assets/immersiveaudio/sounds
          mkdir -p $B/resources/assets/immersiveaudio/lang
          cp ImmersiveAudio.java ModSounds.java ArmorEquipHandler.java $B/java/com/immersiveaudio/
          cp ClientHandler.java GasMaskBreathHandler.java GasMaskBreathSound.java GasMaskHelper.java $B/java/com/immersiveaudio/client/
          cp mods.toml $B/resources/META-INF/
          cp pack.mcmeta $B/resources/
          cp sounds.json $B/resources/assets/immersiveaudio/
          cp en_us.json es_es.json $B/resources/assets/immersiveaudio/lang/
          cp *.ogg $B/resources/assets/immersiveaudio/sounds/
          sed -i \
            -e 's/^mod_id=.*/mod_id=immersiveaudio/' \
            -e 's/^mod_name=.*/mod_name=Immersive Audio/' \
            -e 's/^mod_group_id=.*/mod_group_id=com.immersiveaudio/' \
            -e 's/^mod_version=.*/mod_version=1.0.0/' \
            mdk/gradle.properties

      - name: Compilar
        working-directory: mdk
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Subir el jar
        uses: actions/upload-artifact@v4
        with:
          name: immersiveaudio-jar
          path: mdk/build/libs/*.jar
